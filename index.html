<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>颐护小护 · 智慧陪护</title>
  <meta name="description" content="颐护小护：面向独居老人的多模态智慧陪护应用，九项能力，离线可用。">
  <meta name="theme-color" content="#1E6F5C">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="颐护小护">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="./index.html">
      <img class="leaf" src="assets/img/logo.svg" alt="">
      <em>颐护</em><span>小护</span>
    </a>
    <span class="header-tag"><i></i>离线可用</span>
  </div>
</header>

<main>
  <section class="hero">
    <div class="wrap hero-center">
      <h1>科技赋能，温暖养老</h1>
      <p>用心关爱每一位长者，打造集健康监测、智能守护、生活照料于一体的智慧养老新体验。</p>
      <div class="cta-row">
        <a class="btn btn-primary" href="terminal.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          访问智能终端系统
        </a>
        <a class="btn btn-ghost" href="#modules">浏览六项能力</a>
      </div>
    </div>
  </section>

  <section class="section" id="modules">
    <div class="wrap">
      <div class="section-head">
        <h2>智能陪护监测系统</h2>
        <div class="rule"></div>
        <p>点开任意模块，查看它解决什么问题、如何工作、有哪些关键指标</p>
      </div>

      <div class="grid" id="grid"></div>

      <a class="terminal-card" href="terminal.html">
        <span class="screen">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1E6F5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        </span>
        <span>
          <h3>访问智能终端系统</h3>
          <p id="terminal-host">树莓派 Web 控制台 · 需与设备在同一 Wi-Fi</p>
        </span>
        <span class="btn btn-primary">打开控制台</span>
      </a>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    © 2026 颐护小护 · 本应用可离线使用 · v<span id="app-version">1.0.0</span>
  </div>
</footer>

<div class="install-bar" id="install-bar" hidden>
  <img src="assets/icons/icon-192.png" alt="" width="40" height="40">
  <div class="install-text">
    <strong>把「颐护小护」装到桌面</strong>
    <span id="install-tip">离线可用，打开即用</span>
  </div>
  <button class="btn btn-primary" id="install-btn">安装</button>
  <button class="install-close" id="install-close" aria-label="关闭">×</button>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
