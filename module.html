<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>模块详情 · 颐护小护</title>
  <meta name="theme-color" content="#1E6F5C">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="detail-header">
  <div class="wrap detail-bar">
    <a class="back-icon" href="index.html" aria-label="返回首页">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <span class="detail-bar-title" id="bar-title">智能陪护</span>
    <span class="detail-bar-space" aria-hidden="true"></span>
  </div>
</header>

<main class="wrap" id="detail">
  <section class="detail-hero">
    <div class="art" id="art"></div>
    <div class="detail-title">
      <span class="badge" id="badge"></span>
      <h1 id="title"></h1>
    </div>
    <p class="detail-lead" id="lead"></p>
  </section>

  <section class="block">
    <h2>它解决什么问题</h2>
    <p id="problem"></p>
  </section>

  <section class="block">
    <h2>怎么工作</h2>
    <ol class="steps" id="steps"></ol>
  </section>

  <section class="block">
    <h2>流程示意</h2>
    <div class="flow" id="flow"></div>
    <div class="branch" id="branch"></div>
    <p class="flow-cap">上图：四步主流程；下方为关键判断点的分支走向</p>
  </section>

  <section class="block">
    <h2>关键参数对比</h2>
    <div class="bars" id="bars"></div>
    <p class="flow-cap">条形长度按各自量程归一化，数值见右侧；部分指标为示意值</p>
  </section>

  <section class="block">
    <h2>详细参数</h2>
    <table class="spec-table"><tbody id="specs"></tbody></table>
  </section>

  <section class="block">
    <h2>适用场景</h2>
    <div class="chips" id="chips"></div>
  </section>

  <nav class="pager" id="pager"></nav>
</main>

<footer class="site-footer">
  <div class="wrap">© 2026 颐护小护 · 本应用可离线使用</div>
</footer>

<script src="assets/js/data.js"></script>
<script src="assets/js/module.js"></script>
</body>
</html>
